<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="apple-touch-icon" sizes="180x180" href="https://tailwindcss.com/favicons/favicon-16x16.png?v=3" />
    <link rel="icon" type="image/png" sizes="32x32" href="https://tailwindcss.com/favicons/favicon-16x16.png?v=3" />
    <link rel="icon" type="image/png" sizes="16x16" href="https://tailwindcss.com/favicons/favicon-16x16.png?v=3" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@100..900&display=swap" rel="stylesheet">
    <title> Inventory App | Abolfazl Rahmati </title>
    <link rel="stylesheet" href="build/style.css?v=1">
</head>

<body class="font-outfit bg-main flex items-center justify-center flex-col">
    <!-- web title -->
    <div class="mt-14 flex items-center justify-center">
        <h1 data-i18n="appTitle" class="text-green-600 zz:text-4xl ww:text-3xl xx:text-2xl dd:text-[22px] mx-4 leading-5 ss:text-xl text-wrap text-center w-full font-bold">
            Inventory App With JS & TailwindCSS
        </h1>
    </div>

    <div class="mt-6 flex items-center justify-center gap-2">
        <span data-i18n="languageLabel" class="text-stone-200 text-sm font-medium">Language</span>
        <button type="button" data-lang-option="en" data-i18n="english"
            class="text-stone-200 border-2 border-[#394247] rounded px-3 py-1 text-sm font-semibold focus:outline-none focus:ring-2 focus:ring-green-600">English</button>
        <button type="button" data-lang-option="zh" data-i18n="chinese"
            class="text-stone-200 border-2 border-[#394247] rounded px-3 py-1 text-sm font-semibold focus:outline-none focus:ring-2 focus:ring-green-600">中文</button>
    </div>

    <main class="w-full flex flex-col items-center">

        <!-- Add Category Section -->
        <section class="bg-white/ h-auto mt-16 flex justify-center flex-col zz:py-4 ww:py-3 zz:max-w-[600px] xx:max-w-[92%] ss:max-w-[90%] w-full mx-auto">
            <h2 data-i18n="addNewCategory" class="font-medium text-stone-200 zz:text-[21px] ww:text-[19px] xx:text-[17px] dd:text-[15px] ss:text-[14px] text-left w-full">
                Add New Category
            </h2>

            <div class="bg-[#1a262d] h-auto flex items-start justify-start flex-col w-full xx:my-4 ss:my-3 zz:rounded-3xl ww:rounded-2xl xx:rounded-xl ss:rounded-lg">
                <div class="bg-red-400/ xx:py-4 ss:py-3 zz:px-5 ww:px-4 xx:px-3.5 ss:px-3 flex flex-col w-full">

                    <!-- category title -->
                    <div class="flex flex-col w-full bg-yellow-300/">
                        <label for="categoryTitle" class="w-full text-left zz:text-[17px] ww:text-[16px] xx:text-[15px] dd:text-[13px] ss:text-[12.5px] text-white mt-1 font-medium">
                            <span data-i18n="title">Title</span>
                        </label>
                        <input
                            class="zz:mt-3 ww:mt-2 xx:mt-1.5 ss:mt-1 xx:text-base dd:text-[14px] ss:text-[12.5px] zz:w-52 xx:w-44 bg-transparent outline-none border-[#394247] border-2 text-stone-100 px-2 py-1.5 xx:rounded-xl ss:rounded-lg focus:border-green-600"
                            type="text" name="categoryTitle" id="categoryTitle">
                    </div>

                    <!-- category description -->
                    <div class="flex flex-col w-full bg-yellow-300/ mt-4 pb-2">
                        <label for="categoryDescription" class="w-full text-left zz:text-[17px] ww:text-[16px] xx:text-[15px] dd:text-[13px] ss:text-[12.5px] text-white mt-1 font-medium">
                            <span data-i18n="description">Description</span>
                        </label>
                        <textarea cols="3" id="categoryDescription"
                            class="zz:mt-3 ww:mt-2 xx:mt-1.5 ss:mt-1 w-full h-16 min-h-14 max-h-16 xx:text-base dd:text-[14px] bg-transparent outline-none border-[#394247] border-2 text-stone-100 px-2 py-2 xx:rounded-xl ss:rounded-lg focus:border-green-600"
                            name="categoryDescription"></textarea>
                    </div>

                    <!-- Confirm or reject -->
                    <div class="bg-blue-400/ h-auto flex items-center justify-between w-full xx:mt-4 ss:mt-3">
                        <button id="categoryCanelBtn" data-i18n="cancel"
                            class="zz:text-base ww:text-[15px] xx:text-[14px] dd:text-[13px] ss:text-[12.5px] w-1/2 zz:py-2.5 ww:py-2 xx:py-2 ss:py-1.5 mr-2 text-green-600 border-2 border-green-600 xx:rounded-xl ss:rounded-lg font-semibold">Cancel</button>
                        <button id="categoryAddNewBtn" data-i18n="addCategory"
                            class="zz:text-base ww:text-[15px] xx:text-[14px] dd:text-[13px] ss:text-[12.5px] w-1/2 zz:py-2.5 ww:py-2 xx:py-2 ss:py-1.5 ml-2 text-main bg-green-600 border-2 border-green-600 xx:rounded-xl ss:rounded-lg font-semibold">
                            Add Category
                        </button>
                    </div>
                </div>
            </div>
        </section>

        <!-- Add Product Section -->
        <section class="bg-white/ h-auto mt-10 flex justify-center flex-col py-4 zz:max-w-[600px] xx:max-w-[92%] ss:max-w-[90%] w-full mx-auto">
            <h2 data-i18n="addNewProduct" class="font-medium text-stone-200 zz:text-[21px] ww:text-[19px] xx:text-[17px] dd:text-[15px] ss:text-[14px] text-left w-full">
                Add New Product
            </h2>

            <div class="bg-[#1a262d] h-auto flex items-start justify-start flex-col w-full my-4 ss:my-3 zz:rounded-3xl ww:rounded-2xl xx:rounded-xl ss:rounded-lg">
                <div class="bg-red-400/ xx:py-4 ss:py-3 zz:px-5 ww:px-4 xx:px-3.5 dd:px-3 ss:px-3 flex flex-col w-full">

                    <!-- Product title and quantity -->
                    <div class="flex items-center justify-between w-full ss:flex-col dd:flex-row">

                        <!-- title -->
                        <div class="flex flex-col dd:w-2/5 ss:w-full bg-yellow-300/ dd:mr-2">
                            <label for="productTitle" class="w-full text-left zz:text-[17px] ww:text-[16px] xx:text-[15px] dd:text-[13px] ss:text-[12.5px] text-white mt-1 font-medium">
                                <span data-i18n="title">Title</span>
                            </label>
                            <input
                                class="zz:mt-3 ww:mt-2 xx:mt-1.5 ss:mt-1 w-full bg-transparent outline-none border-[#394247] border-2 text-stone-100 px-2 xx:py-2 dd:py-1 ss:py-1 xx:rounded-xl ss:rounded-lg focus:border-green-600"
                                type="text" name="productTitle" id="productTitle">
                        </div>

                        <!-- quantity -->
                        <div class="flex flex-col dd:w-3/5 ss:w-full bg-yellow-300/ dd:ml-2 ss:mt-2 dd:mt-0">
                            <label for="productQuantity" class="w-full text-left zz:text-[17px] ww:text-[16px] xx:text-[15px] dd:text-[13px] ss:text-[12.5px] text-white mt-1 font-medium">
                                <span data-i18n="quantity">Quantity</span>
                            </label>
                            <div id="quantityCenter"
                                class="flex items-center justify-between zz:mt-3 ww:mt-2 xx:mt-1.5 ss:mt-1 w-full border-[#394247] border-2 text-stone-100 px-2.5 xx:h-11 dd:h-9 ss:h-9 xx:rounded-xl ss:rounded-lg"
                                type="text">
                                <button id="decQty" type="button" aria-label="Decrease quantity" data-i18n-aria="decreaseQuantity" class="toggleBtn flex items-center justify-center p-1 rounded-full bg-[#273842]">
                                    -
                                </button>
                                <p id="productQuantity" class="ww:text-base xx:text-[14px] dd:text-[13px] ss:text-[12px] font-medium text-stone-100">0</p>
                                <button id="incQty" type="button" aria-label="Increase quantity" data-i18n-aria="increaseQuantity" class="toggleBtn flex items-center justify-center p-1 rounded-full bg-[#273842]">
                                    +
                                </button>
                            </div>
                        </div>
                    </div>

                    <!-- product Category Select -->
                    <div class="dd:mt-4 ss:mt-2 flex items-center justify-between w-full ss:flex-col dd:flex-row">

                        <!-- location -->
                        <div class="flex flex-col dd:w-[52%] ss:w-full bg-yellow-300/ dd:mr-2">
                            <label for="productLocations" class="w-full text-left zz:text-[17px] ww:text-[16px] xx:text-[15px] dd:text-[13px] ss:text-[12.5px] text-white mt-1 font-medium">
                                <span data-i18n="location">Location</span>
                            </label>
                            <select id="productLocations" name="productLocation"
                                class="form-select pr-8 pl-3 bg-no-repeat appearance-none w-full ww:text-base xx:text-[14px] ss:text-[13px] zz:mt-3 ww:mt-2 xx:mt-1.5 ss:mt-1 border-[#394247] border-2 text-stone-100 text-[15px] outline-none focus:ring-0 font-normal xx:rounded-xl ss:rounded-lg focus:ring-green-600 focus:border-green-600 block xx:p-2.5 ss:p-1.5 bg-[#1A262D]">
                                <option data-i18n="selectLocation" selected value="none">- select location -</option>
                                <option value="BDG">BDG</option>
                                <option value="JKT">JKT</option>
                                <option value="MLG">MLG</option>
                            </select>
                        </div>

                        <!-- category -->
                        <div class="flex flex-col dd:w-[50%] ss:w-full bg-yellow-300/ dd:ml-2 ss:mt-2 dd:mt-0">
                            <label for="categoriesSelect" class="w-full text-left zz:text-[17px] ww:text-[16px] xx:text-[15px] dd:text-[13px] ss:text-[12.5px] text-white mt-1 font-medium">
                                <span data-i18n="category">Category</span>
                            </label>
                            <select id="categoriesSelect" name="productCategory"
                                class="form-select pr-8 pl-3 bg-no-repeat appearance-none w-full ww:text-base xx:text-[14px] ss:text-[13px] zz:mt-3 ww:mt-2 xx:mt-1.5 ss:mt-1 border-[#394247] border-2 text-stone-100 text-[15px] outline-none focus:ring-0 font-normal xx:rounded-xl ss:rounded-lg focus:ring-green-600 focus:border-green-600 block xx:p-2.5 ss:p-1.5 bg-[#1A262D]">
                                <option data-i18n="selectCategory" selected value="none">- select category -</option>
                            </select>
                        </div>
                    </div>

                    <!-- Add -->
                    <div class="bg-blue-400/ h-auto flex items-center justify-between w-full mt-6">
                        <button id="addNewProductBtn" data-i18n="addProduct"
                            class="zz:text-base ww:text-[15px] xx:text-[14px] dd:text-[13px] ss:text-[12.5px] zz:py-2.5 ww:py-2 xx:py-2 ss:py-1.5 w-full py-2.5 text-main bg-green-600 border-2 border-green-600 xx:rounded-xl ss:rounded-lg font-semibold">
                            Add Product
                        </button>
                    </div>

                    <p id="productError" role="alert" class="hidden mt-3 text-red-300 text-sm font-medium"></p>
                </div>
            </div>
        </section>

        <!-- products list -->
        <section class="mt-10 mb-32 flex items-start justify-center flex-col w-full mx-auto zz:max-w-[600px] ww:max-w-[92%] xx:max-w-[94%] ss:w-[90%]">
            <h2 data-i18n="productsList" class="text-left text-white zz:text-2xl ww:text-xl font-medium w-full">Products List</h2>

            <div class="flex items-center justify-between w-full bg-yellow-400/ mt-5">
                <div class="relative">
                    <label for="searchInput" class="sr-only" style="position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;">Search products</label>
                    <input
                        class="ww:text-base xx:text-[15px] dd:text-[14px] ss:text-[13px] zz:w-52 ww:w-40 dd:w-32 xx:w-28 ss:w-24 bg-transparent outline-none border-[#394247] border-2 text-stone-100 xx:px-3 xx:py-2 dd:px-2 dd:py-1.5 ss:p-1.5 xx:rounded-xl ss:rounded-lg focus:border-green-600"
                        type="text" name="search" placeholder="Search..." data-i18n-placeholder="searchPlaceholder" id="searchInput">
                </div>

                <div class="relative">
                    <label for="sort" class="sr-only" style="position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;">Sort products</label>
                    <select id="sort" name="sort"
                        class="form-select pr-8 pl-3 bg-no-repeat appearance-none zz:w-32 ww:w-28 xx:w-24 dd:w-24 ss:w-20 border-[#394247] border-2 text-stone-100 xx:text-[15px] dd:text-[13px] ss:text-[12px] outline-none focus:ring-0 font-normal xx:rounded-xl ss:rounded-lg focus:ring-green-600 focus:border-green-600 block xx:p-2.5 dd:p-2 ss:p-1.5 bg-[#1A262D]">
                        <option data-i18n="newest" selected value="newest">Newest</option>
                        <option data-i18n="oldest" value="oldest">Oldest</option>
                        <option data-i18n="sortAZ" value="A-Z">A-Z</option>
                        <option data-i18n="sortZA" value="Z-A">Z-A</option>
                    </select>
                </div>
            </div>

            <div class="flex items-center justify-center ww:w-full ss:w-full ww:mr-3 dd:mt-8 ss:mt-6 overflow-x-auto bg-black/">
                <ul id="productsCenter" class="flex flex-col justify-center items-stretch ww:w-full xx:w-[500px] ss:w-[400px] py-2 zz:overflow-hidden ss:overflow-x-auto bg-yellow-500/">
                </ul>
            </div>
        </section>

        <script src="build/webpack/bundle.js?v=1"></script>
    </main>
</body>

</html>
